<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>美股上市公司分类导航</title>
  <meta name="description" content="按细分行业分类的美股全部上市公司目录，左侧全部分类导航，右侧卡片可跳转官网/行情，机器可读。" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1><span class="star">★</span> 美股上市公司分类导航</h1>
    <span class="meta" id="totalMeta">加载中…</span>
    <div class="search">
      <input id="search" type="search" placeholder="搜索公司名 / 股票代码…" autocomplete="off" />
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <h2>全部分类</h2>
      <!-- 分类由 app.js 渲染 -->
    </nav>

    <main class="content">
      <div class="crumbs">
        <span class="title" id="catTitle">全部公司</span>
        <span class="sub" id="catSub"></span>
      </div>
      <div class="note" id="note"></div>
      <div class="grid" id="grid"></div>
      <button class="more" id="more" hidden>加载更多</button>
    </main>
  </div>

  <footer id="footer"></footer>

  <script src="app.js"></script>
</body>
</html>
