<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>美股上市公司分类导航</title>
  <meta name="description" content="美股（NYSE / NASDAQ / AMEX）全部上市公司按主营业务分类导航，左侧分类、右侧卡片可直达官网，支持中英切换与搜索。" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1><span class="star">★</span> <span data-i18n="title">美股上市公司分类导航</span></h1>
    <span class="meta" id="totalMeta">加载中…</span>
    <div class="top-actions">
      <button id="langBtn" class="lang-btn" title="切换语言">EN</button>
      <div class="search">
        <input id="search" type="search" data-i18n-ph="searchPlaceholder" placeholder="搜索公司名 / 股票代码…" autocomplete="off" />
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <h2 data-i18n="allCategories">全部分类</h2>
      <div id="catList"></div>
    </aside>

    <main class="content">
      <div class="crumbs">
        <span class="title" id="catTitle">全部公司</span>
        <span class="sub" id="catSub"></span>
      </div>
      <div class="note" id="note"></div>
      <div class="grid" id="grid"></div>
      <button class="more" id="more" hidden>加载更多</button>
    </main>
  </div>

  <footer id="footer"></footer>

  <script src="app.js"></script>
</body>
</html>
