<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>US Listed Companies Navigator</title>
  <meta name="description" content="A directory of all US-listed companies (NYSE / NASDAQ / AMEX) grouped by primary business. Left sidebar categories, cards link straight to official websites." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1><span class="star">★</span> US Listed Companies Navigator</h1>
    <span class="meta" id="totalMeta">Loading…</span>
    <div class="top-actions">
      <div class="search">
        <input id="search" type="search" placeholder="Search company or ticker…" autocomplete="off" />
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <h2>All Categories</h2>
      <div id="catList"></div>
    </aside>

    <main class="content">
      <div class="crumbs">
        <span class="title" id="catTitle">All Companies</span>
        <span class="sub" id="catSub"></span>
      </div>
      <div class="note" id="note"></div>
      <div class="grid" id="grid"></div>
      <button class="more" id="more" hidden>Load more</button>
    </main>
  </div>

  <footer id="footer"></footer>

  <script src="app.js"></script>
</body>
</html>
